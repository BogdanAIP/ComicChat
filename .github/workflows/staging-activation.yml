name: Staging activation

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase staging project ref
        required: true
        type: string
      mode:
        description: Plan only or apply migrations + deploy Edge Functions
        required: true
        default: plan
        type: choice
        options:
          - plan
          - deploy
      image_provider_mode:
        description: Keep current state, explicitly enable, or explicitly disable external image generation
        required: true
        default: leave-disabled
        type: choice
        options:
          - leave-disabled
          - enable
          - disable

concurrency:
  group: comicchat-staging-activation
  cancel-in-progress: false

jobs:
  staging:
    name: Supabase staging activation
    runs-on: ubuntu-latest
    environment: comicchat-staging
    env:
      PROJECT_REF: ${{ inputs.project_ref }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validate activation inputs
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -Eq '^[a-z0-9-]{8,64}$' <<<"$PROJECT_REF"; then
            echo "Invalid Supabase project ref format" >&2
            exit 1
          fi

          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "comicchat-staging is missing SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi

          if [[ -z "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "comicchat-staging is missing SUPABASE_DB_PASSWORD" >&2
            exit 1
          fi

          if [[ "${{ inputs.mode }}" != "deploy" && "${{ inputs.image_provider_mode }}" != "leave-disabled" ]]; then
            echo "Provider state can only change in deploy mode" >&2
            exit 1
          fi

          if [[ "${{ inputs.image_provider_mode }}" == "enable" ]]; then
            if [[ -z "${OPENAI_API_KEY:-}" ]]; then
              echo "Provider enable requested but OPENAI_API_KEY is not configured" >&2
              exit 1
            fi
            if [[ -z "${STAGING_SUPABASE_DB_URL:-}" ]]; then
              echo "Provider enable requested but STAGING_SUPABASE_DB_URL is not configured" >&2
              exit 1
            fi
          fi

          if [[ "${{ inputs.image_provider_mode }}" == "disable" && -z "${STAGING_SUPABASE_DB_URL:-}" ]]; then
            echo "Provider disable requested but STAGING_SUPABASE_DB_URL is not configured" >&2
            exit 1
          fi

      - name: Read-only MCP authorization readiness before deployment
        if: ${{ inputs.mode == 'deploy' }}
        env:
          COMICCHAT_MCP_URL: https://${{ inputs.project_ref }}.supabase.co/functions/v1/comicchat-mcp
        run: node scripts/comicchat-mcp-remote-readiness.mjs

      - name: Link staging project
        shell: bash
        run: |
          set -euo pipefail
          supabase link \
            --project-ref "$PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Preview remote migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --dry-run

      - name: Plan summary
        if: ${{ inputs.mode == 'plan' }}
        shell: bash
        run: |
          {
            echo "## ComicChat staging plan"
            echo
            echo "- Project ref: `$PROJECT_REF`"
            echo "- Mode: plan only"
            echo "- No migrations, functions, secrets, or provider state were changed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply migrations
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push

      - name: Deploy Edge Functions
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy \
            --project-ref "$PROJECT_REF" \
            --use-api

      - name: Configure OpenAI secret
        if: ${{ inputs.mode == 'deploy' && inputs.image_provider_mode == 'enable' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set \
            --project-ref "$PROJECT_REF" \
            OPENAI_API_KEY="$OPENAI_API_KEY"

      - name: Explicitly enable external image provider
        if: ${{ inputs.mode == 'deploy' && inputs.image_provider_mode == 'enable' }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$STAGING_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE public.comic_generation_config
          SET
            external_generation_enabled = TRUE,
            provider = 'openai-image',
            billing_source = 'comicchat-sponsored-beta',
            model = 'gpt-image-2.5-flare',
            updated_at = NOW()
          WHERE singleton_id = 1;
          SQL

      - name: Explicitly disable external image provider
        if: ${{ inputs.mode == 'deploy' && inputs.image_provider_mode == 'disable' }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$STAGING_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE public.comic_generation_config
          SET
            external_generation_enabled = FALSE,
            updated_at = NOW()
          WHERE singleton_id = 1;
          SQL

      - name: Verify public MCP OAuth challenge
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        env:
          COMICCHAT_MCP_URL: https://${{ inputs.project_ref }}.supabase.co/functions/v1/comicchat-mcp
        run: bash supabase/tests/pr08_mcp_oauth_smoke.sh "$COMICCHAT_MCP_URL"

      - name: Verify public render auth boundary
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        run: |
          bash supabase/tests/pr25_render_edge_smoke.sh \
            "https://$PROJECT_REF.supabase.co/functions/v1/comicchat-render"

      - name: Deployment summary
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        run: |
          {
            echo "## ComicChat staging deployment"
            echo
            echo "- Project ref: `$PROJECT_REF`"
            echo "- Database migrations applied: yes"
            echo "- Edge Functions deployed: yes"
            echo "- MCP public auth smoke: passed"
            echo "- Render public auth smoke: passed"
            echo "- Image provider action: `${{ inputs.image_provider_mode }}`"
            echo
            echo "This workflow does not claim two-account browser acceptance or ChatGPT Plugin UI acceptance."
          } >> "$GITHUB_STEP_SUMMARY"
