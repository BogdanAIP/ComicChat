name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: PR-02 security boundaries
        run: npm run security:pr02

      - name: PR-03 comic-first UX boundaries
        run: npm run ux:pr03

      - name: PR-04 TemplateRenderer goldens
        run: npm run renderer:pr04

      - name: PR-38 comic Skill resolver and renderer compatibility
        run: npm run styles:pr38

      - name: ComicChat connection-first AI/OAuth boundaries
        run: npm run ai:connectors && npm run ai:oauth

      - name: PR-05 generation pipeline boundaries
        run: npm run pipeline:pr05

      - name: PR-06 Sites portability boundaries
        run: npm run portability:pr06

      - name: PR-07 identity/provider permission boundaries
        run: npm run permissions:pr07

      - name: PR-08 plugin/MCP OAuth boundaries
        run: npm run plugin:pr08

      - name: PR-09 Plugin Extension UI boundaries
        run: npm run extension:pr09

      - name: PR-10 production activation boundaries
        run: npm run activation:pr10

      - name: PR-11 beta safety blocking boundaries
        run: npm run safety:pr11

      - name: PR-12 web blocking UX boundaries
        run: npm run ux:pr12

      - name: PR-13 private abuse reporting boundaries
        run: npm run safety:pr13

      - name: PR-14 atomic send rate-limit boundaries
        run: npm run safety:pr14

      - name: PR-15 self-service data export boundaries
        run: npm run privacy:pr15

      - name: PR-16 account deletion-request boundaries
        run: npm run privacy:pr16

      - name: PR-17 explicit conversation-read boundaries
        run: npm run privacy:pr17

      - name: PR-18 negative-security matrix boundaries
        run: npm run security:pr18

      - name: PR-19 fail-closed media boundaries
        run: npm run security:pr19

      - name: PR-20 snapshot-scoped public sharing consent boundaries
        run: npm run privacy:pr20

      - name: PR-21 load abuse concurrency boundaries
        run: npm run stress:pr21

      - name: PR-22 beta safety disclosure boundaries
        run: npm run safety:pr22

      - name: PR-23 authenticated MCP two-account boundaries
        run: npm run acceptance:pr23

      - name: PR-25 private image generation boundaries
        run: npm run media:pr25

      - name: PR-26 character reference continuity boundaries
        run: npm run character:pr26

      - name: PR-27 staging activation boundaries
        run: npm run activation:pr27

      - name: PR-28 fresh Supabase bootstrap boundaries
        run: npm run bootstrap:pr28

      - name: PR-29 ComicChat-first shell boundaries
        run: npm run beta:pr29

      - name: PR-30 two-account browser acceptance boundaries
        run: npm run acceptance:pr30

      - name: Message identity and response-loss regressions
        run: node --test tests/comicMessages.test.mjs

      - name: Build
        env:
          # Provide dummy values so the build doesn't fail on missing env vars.
          # Real secrets are never stored here.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://placeholder.example.com
        run: npm run build

  db-security:
    name: Postgres security integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify PostgreSQL client
        run: psql --version

      - name: Bootstrap Supabase-compatible auth stubs
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE SCHEMA realtime;

          CREATE TABLE realtime.messages (
            extension TEXT
          );

          CREATE OR REPLACE FUNCTION realtime.topic()
          RETURNS TEXT
          LANGUAGE sql
          STABLE
          AS 'SELECT pg_catalog.current_setting(''realtime.topic'', true)';

          CREATE OR REPLACE FUNCTION realtime.send(
            payload JSONB,
            event TEXT,
            topic TEXT,
            private BOOLEAN DEFAULT TRUE
          )
          RETURNS VOID
          LANGUAGE sql
          AS 'SELECT pg_catalog.pg_sleep(0)';

          CREATE TABLE auth.users (
            id UUID PRIMARY KEY,
            email TEXT
          );

          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS UUID
          LANGUAGE sql
          STABLE
          AS $$
            SELECT NULLIF(
              pg_catalog.current_setting('request.jwt.claim.sub', true),
              ''
            )::UUID
          $$;

          GRANT USAGE ON SCHEMA public TO authenticated;
          GRANT USAGE ON SCHEMA public TO service_role;
          SQL

      - name: Apply PR-02 migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261005_pr02_secure_private_chat.sql

      - name: Apply PR-05 migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261005130000_pr05_generation_pipeline.sql

      - name: Apply PR-11 blocking migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261006193000_pr11_blocking_boundary.sql

      - name: Apply PR-13 abuse reporting migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261006202000_pr13_abuse_reports.sql

      - name: Apply PR-14 send rate-limit migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261006211500_pr14_send_rate_limit.sql

      - name: Apply PR-15 self-service data export migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261007163000_pr15_self_service_data_export.sql

      - name: Apply PR-16 account deletion-request migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261007174500_pr16_deletion_request_boundary.sql

      - name: Apply PR-17 conversation-read migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261007182000_pr17_conversation_read_boundary.sql

      - name: Apply PR-18 receive-only Realtime migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261007211000_pr18_realtime_receive_only.sql

      - name: Apply PR-19 fail-closed media migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261007223000_pr19_fail_closed_media.sql

      - name: Apply PR-20 public snapshot consent migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261007231000_pr20_public_snapshot_consent.sql

      - name: Apply PR-22 beta safety disclosure migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261007234500_pr22_beta_safety_disclosure.sql

      - name: Apply PR-25 private image migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261007235500_pr25_private_image_generation.sql

      - name: Apply PR-26 character reference migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261008002500_pr26_character_reference.sql

      - name: Apply PR-35 one-permission story publication migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261008215000_pr35_one_permission_story_publish.sql

      - name: Apply PR-36 group chat migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261008230000_pr36_group_chat.sql

      - name: Apply PR-37 group episode compiler migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261009001000_pr37_group_episode_compiler.sql

      - name: Apply PR-38 versioned comic Style Skills migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261009014000_pr38_comic_style_skills.sql

      - name: Seed legacy publication requests for migration coverage
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/audit_backfill_fixture.sql

      - name: Apply audit fixes migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261009063333_audit_fixes.sql

      - name: Verify legacy publication backfill
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/audit_backfill_assertions.sql

      - name: Verify frozen publication, keyset reads, asset authorization, and retry fencing
        run: bash supabase/tests/audit_fixes_integration.sh

      - name: Run post-migration security assertions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/pr02_security_assertions.sql

      - name: Run PR-05 generation pipeline integration
        run: bash supabase/tests/pr05_generation_pipeline_integration.sh

      - name: Run two-user authorization integration
        run: bash supabase/tests/pr02_two_user_integration.sh

      - name: Run PR-11 blocking integration
        run: bash supabase/tests/pr11_blocking_integration.sh

      - name: Run PR-13 abuse report integration
        run: bash supabase/tests/pr13_abuse_report_integration.sh

      - name: Run PR-14 send rate-limit integration
        run: bash supabase/tests/pr14_send_rate_limit_integration.sh

      - name: Run PR-15 self-service data export integration
        run: bash supabase/tests/pr15_data_export_integration.sh

      - name: Run PR-16 account deletion-request integration
        run: bash supabase/tests/pr16_deletion_request_integration.sh

      - name: Run PR-17 conversation-read IDOR integration
        run: bash supabase/tests/pr17_conversation_read_integration.sh

      - name: Run PR-18 PostgreSQL negative-security matrix
        run: bash supabase/tests/pr18_negative_security_matrix.sh

      - name: Run PR-19 fail-closed media integration
        run: bash supabase/tests/pr19_fail_closed_media_integration.sh

      - name: Run PR-20 public snapshot consent integration
        run: bash supabase/tests/pr20_public_snapshot_consent_integration.sh

      - name: Run PR-35 one-permission comic publication integration
        run: bash supabase/tests/pr35_one_permission_publish_integration.sh

      - name: Run PR-36 group membership and message security integration
        run: bash supabase/tests/pr36_group_chat_integration.sh

      - name: Run PR-37 group episode publication and privacy integration
        run: bash supabase/tests/pr37_group_episode_integration.sh

      - name: Run PR-38 comic Style Skills permission and snapshot integration
        run: bash supabase/tests/pr38_comic_style_skills_integration.sh

      - name: Run PR-21 load abuse concurrency integration
        run: bash supabase/tests/pr21_load_abuse_concurrency.sh

      - name: Run PR-22 beta safety disclosure integration
        run: bash supabase/tests/pr22_beta_safety_disclosure_integration.sh

      - name: Run PR-25 generation provider integration
        run: bash supabase/tests/pr25_generation_provider_integration.sh

      - name: Run PR-26 character reference integration
        run: bash supabase/tests/pr26_character_reference_integration.sh

      - name: Run PR-28 fresh profile bootstrap integration
        run: bash supabase/tests/pr28_profile_bootstrap_integration.sh

  mcp-oauth:
    name: MCP OAuth discovery integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies for private media acceptance
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - id: supabase
        name: Start local Supabase with Edge Runtime
        run: |
          supabase start --exclude studio,inbucket,logflare,vector,supavisor
          supabase status -o env | sed 's/="/=/; s/"$//' >> "$GITHUB_OUTPUT"

      - name: Serve authenticated ComicChat MCP function
        run: |
          supabase functions serve comicchat-mcp > /tmp/comicchat-mcp.log 2>&1 &
          echo $! > /tmp/comicchat-mcp.pid

      - name: Verify OAuth protected-resource handshake
        run: bash supabase/tests/pr08_mcp_oauth_smoke.sh

      - name: Run PR-23 authenticated MCP two-account isolation
        env:
          SUPABASE_URL: ${{ steps.supabase.outputs.API_URL }}
          SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.ANON_KEY }}
          DB_URL: ${{ steps.supabase.outputs.DB_URL }}
        run: node supabase/tests/pr23_mcp_two_account_integration.mjs

      - name: Run PR-25 private media authorization
        env:
          SUPABASE_URL: ${{ steps.supabase.outputs.API_URL }}
          SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.SERVICE_ROLE_KEY }}
          DB_URL: ${{ steps.supabase.outputs.DB_URL }}
        run: node supabase/tests/pr25_private_media_integration.mjs

      - name: Run PR-25 render Edge Runtime smoke
        run: bash supabase/tests/pr25_render_edge_smoke.sh

      - name: Show MCP diagnostics on failure
        if: failure()
        run: |
          cat /tmp/comicchat-mcp.log || true
          supabase status || true
          docker ps -a || true

      - name: Stop isolated local Supabase
        if: always()
        run: |
          test ! -f /tmp/comicchat-mcp.pid || kill "$(cat /tmp/comicchat-mcp.pid)" || true
          supabase stop --no-backup || true

  realtime:
    name: Local Supabase realtime integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for Realtime harness
        uses: actions/setup-node@v4
        with:
          # The browser app remains built on .nvmrc (Node 20). The Node-based
          # Realtime harness uses Node 22 for its native WebSocket transport.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - id: supabase
        name: Start isolated local Supabase
        run: |
          supabase start --exclude studio,storage-api,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
          supabase status -o env | sed 's/="/=/; s/"$//' >> "$GITHUB_OUTPUT"

      - name: Verify private Broadcast authorization
        env:
          DB_URL: ${{ steps.supabase.outputs.DB_URL }}
        run: |
          policy="$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select policyname from pg_policies where schemaname='realtime' and tablename='messages' and policyname='comicchat_receive_broadcast'")"
          test "$policy" = "comicchat_receive_broadcast"

          triggers="$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select tgname from pg_trigger where not tgisinternal and tgname in ('comic_membership_broadcast_insert','comic_message_broadcast_change') order by tgname")"
          printf '%s\n' "$triggers"
          grep -qx 'comic_membership_broadcast_insert' <<<"$triggers"
          grep -qx 'comic_message_broadcast_change' <<<"$triggers"

      - name: Run Auth + Realtime + reconnect integration
        env:
          SUPABASE_URL: ${{ steps.supabase.outputs.API_URL }}
          SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.SERVICE_ROLE_KEY }}
          DB_URL: ${{ steps.supabase.outputs.DB_URL }}
        run: node supabase/tests/pr02_realtime_integration.mjs

      - name: Run PR-18 Realtime negative-security matrix
        env:
          SUPABASE_URL: ${{ steps.supabase.outputs.API_URL }}
          SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.SERVICE_ROLE_KEY }}
        run: node supabase/tests/pr18_realtime_negative_security.mjs

      - name: Show local Supabase diagnostics on failure
        if: failure()
        run: |
          supabase status || true
          docker ps -a || true
          docker logs supabase_realtime_comicchat_pr02_ci --tail 300 || true

      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup || true
