name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: PR-02 security boundaries
        run: npm run security:pr02

      - name: Build
        env:
          # Provide dummy values so the build doesn't fail on missing env vars.
          # Real secrets are never stored here.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://placeholder.example.com
        run: npm run build

  db-security:
    name: Postgres security integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify PostgreSQL client
        run: psql --version

      - name: Bootstrap Supabase-compatible auth stubs
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;

          CREATE TABLE auth.users (
            id UUID PRIMARY KEY,
            email TEXT
          );

          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS UUID
          LANGUAGE sql
          STABLE
          AS $$
            SELECT NULLIF(
              pg_catalog.current_setting('request.jwt.claim.sub', true),
              ''
            )::UUID
          $$;

          CREATE TABLE public."user" (
            id UUID PRIMARY KEY REFERENCES auth.users(id) ON DELETE CASCADE,
            username TEXT,
            email TEXT,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );

          CREATE PUBLICATION supabase_realtime;
          GRANT USAGE ON SCHEMA public TO authenticated;
          SQL

      - name: Apply PR-02 migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261005_pr02_secure_private_chat.sql

      - name: Run post-migration security assertions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/pr02_security_assertions.sql

      - name: Run two-user authorization integration
        run: bash supabase/tests/pr02_two_user_integration.sh

