project_id = "comicchat_pr02_ci"

[db]
port = 54322
shadow_port = 54320
major_version = 17

[realtime]
enabled = true
ip_version = "IPv4"

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = true

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true

[functions.comicchat-mcp]
# OAuth middleware validates the user token. The Edge gateway must not consume it first.
verify_jwt = false

[functions.comicchat-story-art]
# Explicit getUser plus service-only episode authorization precede byte access.
verify_jwt = false

[functions.comicchat-worker]
# Dedicated high-entropy cron credential; no browser or anonymous queue drain.
verify_jwt = false


[functions.comicchat-render]
# The function validates the bearer with auth.getUser(), then uses service_role
# only after proving the caller owns the sender-attributed generation job.
verify_jwt = false

[functions.comicchat-chatgpt-art]
# getUser and sender ownership are validated before any private asset upload.
verify_jwt = false
